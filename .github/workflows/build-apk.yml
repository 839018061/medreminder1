name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Gradle wrapper
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f ./gradlew ]; then
            wget -q https://mirrors.cloud.tencent.com/gradle/gradle-8.6-bin.zip -O gradle.zip
            unzip -q gradle.zip
            ./gradle-8.6/bin/gradle wrapper --gradle-version 8.6
            rm -rf gradle-8.6 gradle.zip
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
